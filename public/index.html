
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Cloud Service Catalog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 650px;
            width: 100%;
            padding: 45px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1d4ed8;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .student {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        a {
            background: #2563eb;
            color: white;
            padding: 13px 20px;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        a:hover {
            background: #1e40af;
        }

        footer {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Enterprise Cloud Service Catalog</h1>

        <p class="subtitle">
            Explore our cloud services and check platform availability.
        </p>

        <div class="student">
            <strong>Student Name:</strong> Sri varshini R K<br>
            <strong>Roll Number:</strong> 2648059
        </div>

        <div class="buttons">
            <a href="/api/services">View Cloud Services</a>
            <a href="/api/status">Check System Status</a>
        </div>

        <footer>
            Powered by Node.js and Express
        </footer>

    </div>
</body>
</html>
